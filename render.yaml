services:
  - type: web
    name: yiriba-license
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: YIRIBA_SECRET
        sync: false
      - key: YIRIBA_ADMIN_TOKEN
        sync: false
      - key: YIRIBA_DB
        value: /data/licenses.db
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      mountPath: /data
      sizeGB: 1
